<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="1000" height="490" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f4e8c"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="490" rx="12" fill="#ffffff" stroke="#d0d7de"/>

  <!-- group frames -->
  <g fill="#f4f8fd" stroke="#1f4e8c" stroke-width="1.5">
    <rect x="20" y="20" width="300" height="400" rx="8"/>
    <rect x="350" y="20" width="250" height="400" rx="8"/>
    <rect x="630" y="20" width="350" height="400" rx="8"/>
  </g>
  <g fill="#1f4e8c" font-size="15" font-weight="600" text-anchor="middle">
    <text x="170" y="46">1. Monitoring &amp; Anomaly Detection</text>
    <text x="475" y="46">2. Operating KPIs</text>
    <text x="805" y="46">3. Operating-condition Optimization</text>
  </g>

  <!-- boxes -->
  <g fill="#ffffff" stroke="#44546a" stroke-width="1.2">
    <!-- monitoring -->
    <rect x="40" y="70" width="260" height="56" rx="5"/>
    <rect x="40" y="160" width="260" height="60" rx="5"/>
    <rect x="40" y="260" width="260" height="56" rx="5"/>
    <rect x="40" y="350" width="260" height="56" rx="5"/>
    <!-- KPI -->
    <rect x="370" y="150" width="210" height="70" rx="5"/>
    <rect x="370" y="260" width="210" height="70" rx="5"/>
    <!-- optimization -->
    <rect x="650" y="70" width="310" height="50" rx="5"/>
    <rect x="650" y="140" width="310" height="50" rx="5"/>
    <rect x="650" y="230" width="310" height="80" rx="5"/>
    <rect x="790" y="350" width="170" height="56" rx="5"/>
  </g>

  <g fill="#1b1f24" font-size="13" text-anchor="middle">
    <text x="170" y="94">context_feat_1 .. M</text>
    <text x="170" y="112" fill="#57606a" font-size="12">monitored process variables</text>

    <text x="170" y="185">Short-horizon forecast</text>
    <text x="170" y="203" fill="#57606a" font-size="12">moving-average / lag-based ML models</text>

    <text x="170" y="284">Indicator models</text>
    <text x="170" y="302" fill="#57606a" font-size="12">indicator_1 .. K</text>

    <text x="170" y="374">decision_feat_1 .. N</text>
    <text x="170" y="392" fill="#57606a" font-size="12">current set-points</text>

    <text x="475" y="177">Window aggregation</text>
    <text x="475" y="195" fill="#57606a" font-size="12">observed past + forecast horizon</text>

    <text x="475" y="287">kpi_primary</text>
    <text x="475" y="305" fill="#57606a" font-size="12">kpi_ratio_a / b / ...</text>

    <text x="805" y="100">Objective: maximize kpi_primary</text>
    <text x="805" y="170">Constraints: KPI bounds (penalty)</text>
    <text x="805" y="266" font-weight="600">Metaheuristic search</text>
    <text x="805" y="285" fill="#57606a" font-size="12">KNN warm start from similar past states</text>
    <text x="875" y="378">Recommended</text>
    <text x="875" y="396" fill="#57606a" font-size="12">set-points</text>
  </g>

  <!-- solid arrows -->
  <g fill="none" stroke="#1f4e8c" stroke-width="1.6" marker-end="url(#arrow)">
    <path d="M170,126 L170,160"/>
    <path d="M170,220 L170,260"/>
    <path d="M170,350 L170,316"/>
    <path d="M300,288 L335,288 L335,185 L370,185"/>
    <path d="M475,220 L475,260"/>
    <path d="M580,295 L615,295 L615,95 L650,95"/>
    <path d="M615,165 L650,165"/>
    <path d="M960,95 L972,95 L972,270 L960,270"/>
    <path d="M960,165 L972,165" marker-end="none"/>
    <path d="M875,310 L875,350"/>
  </g>

  <!-- feedback loop -->
  <path d="M700,310 L700,458 L170,458 L170,406" fill="none" stroke="#8a5a00" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-dash)"/>
  <text x="435" y="451" fill="#8a5a00" font-size="12" text-anchor="middle">candidate set-points are re-evaluated by the indicator models</text>
</svg>
